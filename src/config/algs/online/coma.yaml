# --- COMA 具体参数 ---
# online
action_selector: "multinomial"
epsilon_start: .5
epsilon_finish: .01
epsilon_anneal_time: 100000
mask_before_softmax: False

runner: "parallel"

buffer_size: 8
batch_size_run: 8
batch_size: 8

env_args:
  state_last_action: False # Critic 在内部添加了最后一个动作

# 每 {} 个训练步更新一次目标网络
target_update_interval_or_tau: 200

lr: 0.0005
critic_lr: 0.0005
td_lambda: 0.8

# 使用 COMA
agent_output_type: "pi_logits"
learner: "coma_learner"
critic_q_fn: "coma"
critic_baseline_fn: "coma"
critic_train_mode: "seq"
critic_train_reps: 1
q_nstep: 0  # 0 表示默认 Q，1 表示 r + gamma*Q，依此类推

name: "coma"
