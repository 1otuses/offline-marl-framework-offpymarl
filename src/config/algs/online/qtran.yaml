# --- QMIX 具体参数 ---
# online
# 使用 epsilon 贪婪动作选择器
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

runner: "episode"

buffer_size: 5000

# 每 {} 个回合更新一次目标网络
target_update_interval_or_tau: 200

# 使用 Q_Learner 进行训练
agent_output_type: "q"
learner: "qtran_learner"
double_q: True
mixer: "qtran_base"
mixing_embed_dim: 64
qtran_arch: "qtran_paper"

opt_loss: 1
nopt_min_loss: 0.1

network_size: small

name: "qtran"
