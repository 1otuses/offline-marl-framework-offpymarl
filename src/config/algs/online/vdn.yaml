# --- VDN 具体参数 ---
# online
# 使用 epsilon 贪婪动作选择器
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

runner: "episode"

buffer_size: 5000

# 每 {} 个回合更新一次目标网络
target_update_interval_or_tau: 200

# 使用 Q_Learner 进行训练
agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "vdn"

cal_target: "td_lambda"
td_lambda: 0.6 # 6h_vs_8z 为 0.3，其他为 0.6

name: "vdn"
