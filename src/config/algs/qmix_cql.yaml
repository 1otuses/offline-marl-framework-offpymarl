# --- QMIX+CQL 具体参数 ---

# 使用 epsilon 贪婪动作选择器
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

runner: "episode"

buffer_size: 5000

# 每 {} 个回合更新一次目标网络
target_update_interval_or_tau: 0.01

# 使用 Q_Learner 进行训练
agent_output_type: "q"
learner: "q_learner"
double_q: True
# mixer: "qmix"
mixer: "nmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

cal_target: "td_lambda"
td_lambda: 0.6 # 6h_vs_8z 为 0.3，其他为 0.6

cql_alpha: 1. # 很大程度上取决于数据集的质量
cql_type: "individual"

raw_sample_actions: 32

name: "qmix_cql"

