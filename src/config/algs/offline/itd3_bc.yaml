# --- ITD3+BC 具体参数 ---
# offline
runner: "episode"

buffer_size: 50000
# 每 {} 个回合更新一次目标网络
target_update_interval_or_tau: .005

obs_agent_id: True
obs_last_action: False
obs_individual_obs: True


# 使用 madddpg_learner 进行训练
mac: "maddpg_mac"
reg: 0.001
batch_size: 32
lr: 0.0003
use_rnn: False # 无 RNN 时效果更好（至少在专家数据上）

standardise_returns: False
standardise_rewards: True

learner: "itd3_learner"
agent_output_type: "pi_logits"
hidden_dim: 128
critic_type: "itd3_critic"

optim_type: "adam"
actor_freq: 2
td3_alpha: 2.5
critic_rnn: True

name: "itd3_bc"

