# --- ICQ 具体参数 ---
# offline
action_selector: "multinomial"
epsilon_start: .5
epsilon_finish: .05
epsilon_anneal_time: 500000
mask_before_softmax: False

#runner: "episode"
runner: "parallel"

buffer_size: 32
# off_buffer_size : 70000 # size of the off-policy buffer default: 5000
batch_size_run: 10 # 10
batch_size: 16
offline_batch_size: 16
grad_norm_clip: 20


env_args:
  state_last_action: True # Critic 在内部添加了最后一个动作

# 每 {} 个训练步更新一次目标网络
target_update_interval_or_tau: 600
step: 5 #树回溯图的步数（可根据智能体数量调整）


lr: 0.0005
critic_lr: 0.0001
td_lambda: 0.75

# 使用 qmix
mixing_embed_dim: 32
hypernet_layers: 1

critic_hidden_dim: 256
optim_type: "rmsprop"
# optim_type: "Adam"
icq_alpha: 0.1
icq_beta: 1000

# 使用 COMA
agent_output_type: "pi_logits"
learner: "icq_learner"
q_nstep: 0  # 0 表示默认 Q，1 表示 r + gamma*Q，依此类推

name: "icq"

