# --- CFCQL 具体参数 ---
# offline
# 使用 epsilon 贪婪动作选择器
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000 # 6h_vs_8z 使用 500000，其他场景使用 100000

# runner: "episode"
runner: "episode"

buffer_size: 5000


# 每 {} 个回合更新一次目标网络
target_update_interval_or_tau: 200

# 使用 Q_Learner 进行训练
agent_output_type: q

behaviour_log_interval: 2000
behaviour_model_path: ""
behaviour_t_max: 20000

learner: "cfcq_learner"
mixer: "nmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # 智能体的学习率
td_lambda: 0.6 # 6h_vs_8z 为 0.3，其他为 0.6
train_behaviour: True



global_cql_alpha: 50.0
# counterfactual: 1
raw_cql: False
sparse_lambda: False
softmax_temp: 5
training_episodes: 5000
raw_sample_actions: 100


cal_target: "td_lambda"
cal_dcql: False
behaviour_mini_epoch: 1

name: "cfcql"